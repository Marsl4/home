<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Icon für Mac-Dock und iPad-Home-Bildschirm -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Home" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Home</title>
    <script>
      // Hell/Dunkel sofort setzen (bevor die App geladen ist), damit nichts weiß aufblitzt.
      try {
        const choice = JSON.parse(localStorage.getItem("ui:theme") || '"system"');
        const dark = choice === "dark" || (choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}

      // Falls die App beim Start abstürzt: Fehler anzeigen statt leerer Seite.
      // (Bleibt die Seite leer, fehlt sonst jeder Hinweis, was los ist.)
      function showStartError(message) {
        if (!document.getElementById("boot-loading")) return; // App läuft schon
        const box = document.getElementById("start-error") || document.body.appendChild(document.createElement("pre"));
        box.id = "start-error";
        box.style.cssText = "margin:24px;padding:16px;white-space:pre-wrap;font:13px -apple-system,sans-serif;background:#fef2f2;color:#b91c1c;border-radius:8px";
        box.textContent += "Die App konnte nicht starten:\n" + message + "\n\n";
      }
      window.addEventListener("error", (e) => showStartError(e.message || String(e.error)));
      window.addEventListener("unhandledrejection", (e) => showStartError(String(e.reason?.stack || e.reason)));

      // Dauert der Start zu lange: Hilfe anzeigen. "Neu laden" leert nur den Zwischenspeicher
      // der App-Dateien (Service Worker + Cache) – Notizen, PDFs usw. bleiben erhalten.
      setTimeout(() => {
        const loading = document.getElementById("boot-loading");
        if (!loading) return;
        loading.innerHTML =
          '<div style="max-width:420px;padding:24px;text-align:center;line-height:1.5">' +
          "<p><b>Home lädt ungewöhnlich lange.</b></p>" +
          "<p>Deine Daten sind sicher. Tippe auf den Knopf, um die App-Dateien neu zu laden.</p>" +
          '<p><button id="boot-reset" style="padding:10px 16px;border:none;border-radius:8px;background:#4f46e5;color:#fff;font-size:15px">App neu laden</button></p>' +
          '<p style="font-size:11px;opacity:.7;word-break:break-all">' + navigator.userAgent + "</p></div>";
        document.getElementById("boot-reset").onclick = async () => {
          try {
            for (const reg of (await navigator.serviceWorker?.getRegistrations()) || []) await reg.unregister();
            for (const key of (await caches?.keys()) || []) await caches.delete(key);
          } catch {}
          location.reload();
        };
      }, 20000);
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Wird angezeigt, bis die App geladen ist (beim ersten Öffnen kann das etwas dauern). -->
      <div id="boot-loading" style="height:100vh;display:flex;align-items:center;justify-content:center;font:15px -apple-system,sans-serif;color:#8d8c88">
        Home wird geladen …
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
